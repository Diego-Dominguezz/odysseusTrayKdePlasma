# Odysseus KDE Integration — Ollama Resource Safety Override
#
# Installed by install.sh to /etc/systemd/system/ollama.service.d/override.conf
#
# NETWORKING:
#   1. OLLAMA_HOST=0.0.0.0:11434  — Listen on all interfaces so Docker containers can connect
#
# MODEL BEHAVIOR:
#   2. OLLAMA_KEEP_ALIVE=30m      — Keep model loaded for 30 minutes after last request
#                                   to prevent frequent reload latency and memory churn
#   3. OLLAMA_NUM_PARALLEL=1      — Limit to one concurrent request to reduce peak memory
#   4. OLLAMA_MAX_LOADED_MODELS=1 — Only load one model at a time
#   5. OLLAMA_FLASH_ATTENTION=1   — Enable flash attention to slightly reduce VRAM usage
#
# SYSTEM RAM SAFETY (desktop fluency protection):
#   Ollama gets full GPU/VRAM access — no VRAM reservation.
#   Only system RAM is bounded to prevent memory pressure from freezing the desktop.
#
#   MemoryHigh=24G  — Soft limit: Ollama throttled above 24 GB system RAM
#   MemoryMax=27G   — Hard limit: Ollama killed if exceeding 27 GB
#   OOMScoreAdjust=500 — Ollama sacrificed first under memory pressure
#                        (KDE Plasma, KWin, Wayland have lower scores)
#
# RATIONALE: Full GPU performance for the model, system RAM bounded so the
# desktop (KDE Plasma / Wayland) stays fluent even under memory pressure.
# MemAvailable target: >= 5 GiB reserved for desktop processes.

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_FLASH_ATTENTION=1"

# System RAM safety — protects desktop fluency, NOT GPU VRAM (full GPU access)
MemoryHigh=24G
MemoryMax=27G
OOMScoreAdjust=500